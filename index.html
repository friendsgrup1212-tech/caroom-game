
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrom King - 2 Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#101827,#263c52);
    color:white;
    text-align:center;
    min-height:100vh;
    padding:20px;
}

h1{
    color:#ffd166;
    margin:15px;
    font-size:32px;
}

.game-info{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin:20px;
}

.player{
    background:#24364a;
    padding:15px 25px;
    border-radius:12px;
    border:2px solid #607d8b;
    min-width:130px;
}

.player.active{
    border-color:#ffd166;
    box-shadow:0 0 15px #ffd166;
}

.player h3{
    color:#ffd166;
    margin-bottom:8px;
}

#turn{
    color:#00e5ff;
    margin:15px;
    font-size:19px;
    font-weight:bold;
}

.board-container{
    width:min(90vw,650px);
    margin:20px auto;
    background:#59341c;
    padding:clamp(12px,3vw,25px);
    border-radius:15px;
    box-shadow:0 15px 40px #0009;
}

canvas{
    width:100%;
    display:block;
    background:#e8b978;
    border:8px solid #8b542e;
    border-radius:5px;
    touch-action:none;
}

button{
    padding:12px 25px;
    background:#ffd166;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin:10px;
}

button:hover{
    background:#ffb703;
}

.help{
    color:#ddd;
    margin:15px auto;
    max-width:600px;
    line-height:1.7;
}
</style>
</head>

<body>

<h1>🎯 CARROM KING</h1>
<p>2 Player Carrom Board Game</p>

<div class="game-info">
    <div class="player active" id="p1">
        <h3>Player 1</h3>
        Score: <span id="s1">0</span>
    </div>

    <div class="player" id="p2">
        <h3>Player 2</h3>
        Score: <span id="s2">0</span>
    </div>
</div>

<div id="turn">Player 1's Turn</div>

<div class="board-container">
    <canvas id="board" width="600" height="600"></canvas>
</div>

<button onclick="restart()">🔄 Restart Game</button>

<div class="help">
    <b>How to Play:</b><br>
    1. Striker ko mouse ya finger se drag karke aim karein.<br>
    2. Striker ko peeche kheenchkar chhod dein.<br>
    3. Coins ko pockets mein daalein.<br>
    4. Coin pocket hone par score milega.
</div>

<script>
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");

const W=600;
const H=600;

const pockets=[
    [45,45],[555,45],[45,555],[555,555]
];

let coins=[];
let striker;
let currentPlayer=1;
let scores=[0,0];
let moving=false;
let dragging=false;
let aim={x:0,y:0};
let gameOver=false;
let turnShot=false;
let shotScored=false;
let foul=false;

function createCoin(x,y,color,type){
    return {
        x,y,vx:0,vy:0,
        r:type==="striker"?18:13,
        color,type,
        mass:type==="striker"?1.5:1
    };
}

function restart(){
    coins=[];
    scores=[0,0];
    currentPlayer=1;
    moving=false;
    dragging=false;
    gameOver=false;
    turnShot=false;
    shotScored=false;
    foul=false;

    // Center coins
    coins.push(createCoin(300,300,"#d62828","queen"));

    const positions=[
        [300,274],[323,287],[323,313],
        [300,326],[277,313],[277,287],
        [300,254],[340,300],[300,346],[260,300],
        [316,260],[340,274],[284,260],
        [260,326],[316,340],[284,340]
    ];

    positions.forEach((p,i)=>{
        coins.push(createCoin(
            p[0],p[1],
            i%2===0?"#222":"#f8f5ed",
            "coin"
        ));
    });

    striker=createCoin(300,505,"#ffca28","striker");
    updateUI();
    draw();
}

function updateUI(){
    document.getElementById("s1").textContent=scores[0];
    document.getElementById("s2").textContent=scores[1];

    document.getElementById("p1").classList.toggle("active",currentPlayer===1);
    document.getElementById("p2").classList.toggle("active",currentPlayer===2);

    document.getElementById("turn").textContent=
        gameOver?"🏆 Game Over!":
        "Player "+currentPlayer+"'s Turn";
}

function drawBoard(){
    ctx.clearRect(0,0,W,H);

    // Board
    ctx.fillStyle="#e8b978";
    ctx.fillRect(0,0,W,H);

    // Inner border
    ctx.strokeStyle="#874c25";
    ctx.lineWidth=5;
    ctx.strokeRect(45,45,510,510);

    // Center circle
    ctx.beginPath();
    ctx.arc(300,300,75,0,Math.PI*2);
    ctx.strokeStyle="#a65e30";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(300,300,10,0,Math.PI*2);
    ctx.fillStyle="#a65e30";
    ctx.fill();

    // Center decorative rings
    ctx.beginPath();
    ctx.arc(300,300,55,0,Math.PI*2);
    ctx.stroke();

    // Striker baselines
    ctx.strokeStyle="#9b4d24";
    ctx.lineWidth=3;

    [110,490].forEach(y=>{
        ctx.beginPath();
        ctx.moveTo(120,y);
        ctx.lineTo(480,y);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(120,y,14,0,Math.PI*2);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(480,y,14,0,Math.PI*2);
        ctx.stroke();
    });

    // Pockets
    pockets.forEach(([x,y])=>{
        ctx.beginPath();
        ctx.arc(x,y,25,0,Math.PI*2);
        ctx.fillStyle="#20130e";
        ctx.fill();
        ctx.strokeStyle="#b47b43";
        ctx.lineWidth=4;
        ctx.stroke();
    });
}

function drawPiece(piece){
    ctx.beginPath();
    ctx.arc(piece.x,piece.y,piece.r,0,Math.PI*2);

    ctx.fillStyle=piece.color;
    ctx.fill();

    ctx.strokeStyle="#8c603c";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(piece.x-4,piece.y-4,piece.r*0.25,0,Math.PI*2);
    ctx.fillStyle="#ffffff66";
    ctx.fill();
}

function drawAim(){
    if(!dragging)return;

    ctx.beginPath();
    ctx.moveTo(striker.x,striker.y);
    ctx.lineTo(aim.x,aim.y);
    ctx.strokeStyle="#e63946";
    ctx.lineWidth=3;
    ctx.setLineDash([8,5]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.arc(aim.x,aim.y,5,0,Math.PI*2);
    ctx.fillStyle="#e63946";
    ctx.fill();
}

function draw(){
    drawBoard();

    coins.forEach(drawPiece);
    drawPiece(striker);
    drawAim();
}

function position(e){
    const rect=canvas.getBoundingClientRect();

    return {
        x:(e.clientX-rect.left)*W/rect.width,
        y:(e.clientY-rect.top)*H/rect.height
    };
}

canvas.addEventListener("pointerdown",e=>{
    if(moving||gameOver)return;

    const p=position(e);

    if(Math.hypot(p.x-striker.x,p.y-striker.y)<35){
        dragging=true;
        aim=p;
        canvas.setPointerCapture(e.pointerId);
        draw();
    }
});

canvas.addEventListener("pointermove",e=>{
    if(!dragging)return;
    aim=position(e);
    draw();
});

canvas.addEventListener("pointerup",()=>{
    if(!dragging)return;

    dragging=false;

    let dx=striker.x-aim.x;
    let dy=striker.y-aim.y;

    let distance=Math.hypot(dx,dy);

    if(distance>5){
        const power=Math.min(distance*0.12,15);

        striker.vx=(dx/distance)*power;
        striker.vy=(dy/distance)*power;

        moving=true;
        turnShot=true;
        shotScored=false;
        foul=false;
        requestAnimationFrame(loop);
    }

    draw();
});

function collide(a,b){
    let dx=b.x-a.x;
    let dy=b.y-a.y;

    let distance=Math.hypot(dx,dy);
    let minDist=a.r+b.r;

    if(distance===0)distance=0.01;

    if(distance<minDist){
        let nx=dx/distance;
        let ny=dy/distance;

        let overlap=minDist-distance;

        a.x-=nx*overlap*0.5;
        a.y-=ny*overlap*0.5;
        b.x+=nx*overlap*0.5;
        b.y+=ny*overlap*0.5;

        let relative=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;

        if(relative>0){
            let impulse=1.85*relative/(1/a.mass+1/b.mass);

            a.vx-=impulse*nx/a.mass;
            a.vy-=impulse*ny/a.mass;

            b.vx+=impulse*nx/b.mass;
            b.vy+=impulse*ny/b.mass;
        }
    }
}

function checkPocket(piece){
    for(let [x,y] of pockets){
        if(Math.hypot(piece.x-x,piece.y-y)<25){
            if(piece.type==="striker"){
                foul=true;
            }else{
                if(piece.type==="queen"){
                    scores[currentPlayer-1]+=3;
                }else{
                    scores[currentPlayer-1]+=1;
                }

                shotScored=true;
            }

            return true;
        }
    }

    return false;
}

function physics(){
    const pieces=[...coins,striker];

    pieces.forEach(p=>{
        p.x+=p.vx;
        p.y+=p.vy;

        p.vx*=0.985;
        p.vy*=0.985;

        if(Math.abs(p.vx)<0.04)p.vx=0;
        if(Math.abs(p.vy)<0.04)p.vy=0;

        if(p.x-p.r<45){
            p.x=45+p.r;
            p.vx=Math.abs(p.vx)*0.8;
        }

        if(p.x+p.r>555){
            p.x=555-p.r;
            p.vx=-Math.abs(p.vx)*0.8;
        }

        if(p.y-p.r<45){
            p.y=45+p.r;
            p.vy=Math.abs(p.vy)*0.8;
        }

        if(p.y+p.r>555){
            p.y=555-p.r;
            p.vy=-Math.abs(p.vy)*0.8;
        }
    });

    for(let i=0;i<pieces.length;i++){
        for(let j=i+1;j<pieces.length;j++){
            collide(pieces[i],pieces[j]);
        }
    }

    coins=coins.filter(c=>!checkPocket(c));

    if(checkPocket(striker)){
        striker=createCoin(300,currentPlayer===1?505:95,"#ffca28","striker");
    }

    const allStopped=pieces.every(p=>
        Math.abs(p.vx)<0.04 && Math.abs(p.vy)<0.04
    );

    if(allStopped){
        moving=false;

        if(foul){
            scores[currentPlayer-1]=Math.max(0,scores[currentPlayer-1]-1);
        }

        if(!shotScored||foul){
            currentPlayer=currentPlayer===1?2:1;
        }

        striker=createCoin(300,currentPlayer===1?505:95,"#ffca28","striker");

        if(coins.length===0){
            gameOver=true;
            const winner=scores[0]===scores[1]?"Match Draw!":
                "🏆 Player "+(scores[0]>scores[1]?1:2)+" Wins!";
            document.getElementById("turn").textContent=winner;
        }

        updateUI();
    }
}

function loop(){
    if(!moving)return;

    physics();
    draw();

    if(moving){
        requestAnimationFrame(loop);
    }
}

restart();
</script>

</body>
</html>
